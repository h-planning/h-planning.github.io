# Installe automatiquement sur Supabase ce que Claude publie dans ce dépôt :
#  - chaque nouveau fichier de supabase/migrations/ (exécuté une seule fois, dans l'ordre des noms)
#  - la fonction manage-user (création des comptes)
# Secret nécessaire (Settings → Secrets and variables → Actions) : SUPABASE_ACCESS_TOKEN
name: Supabase
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**', '.github/workflows/supabase.yml']
  workflow_dispatch:
concurrency: { group: supabase, cancel-in-progress: false }
env:
  PROJECT_REF: ndghmjbiztusgmgamfaa
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le jeton
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant"; exit 1; fi
      - name: Migrations de la base
        run: |
          set -euo pipefail
          q() {   # exécute du SQL via l'API Supabase ; s'arrête en cas d'erreur
            local body; body=$(jq -n --arg q "$1" '{query: $q}')
            local out code
            out=$(curl -sS -w '\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
            code=$(echo "$out" | tail -n1); out=$(echo "$out" | sed '$d')
            if [ "$code" -ge 300 ]; then echo "::error::SQL refusé ($code) : $out"; return 1; fi
            echo "$out"
          }
          q "create table if not exists public.hpg_migrations (name text primary key, applied_at timestamptz not null default now()); alter table public.hpg_migrations enable row level security;" > /dev/null
          shopt -s nullglob
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            done_=$(q "select count(*)::int as n from public.hpg_migrations where name = '$n'" | jq -r '.[0].n')
            if [ "$done_" = "1" ]; then echo "déjà installée : $n"; continue; fi
            echo "installation : $n"
            q "begin; $(cat "$f"); insert into public.hpg_migrations(name) values ('$n'); commit;" > /dev/null
            echo "ok : $n"
          done
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Fonction manage-user
        run: supabase functions deploy manage-user --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
